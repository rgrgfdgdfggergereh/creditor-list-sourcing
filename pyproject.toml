[project]
name = "creditor-sourcing"
version = "0.1.0"
description = "Source trade credit insurance prospects from Australian external administrations"
requires-python = ">=3.11"

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
