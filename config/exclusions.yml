# Which creditors are NOT trade credit insurance prospects.
#
# A trade credit policy insures a supplier's receivables ledger. So the
# prospect we want is an unsecured TRADE supplier that sold goods or services
# on credit terms. Everything below is owed money for some other reason and is
# either uninsurable on this exposure or not a buyer.
#
# Matching is case-insensitive against the creditor name. Keep patterns as
# whole-word-ish fragments; `qualify.py` word-boundaries them.

statutory:
  reason: Statutory / government creditor - not a trade supplier
  patterns:
    - australian taxation office
    - deputy commissioner of taxation
    - commissioner of taxation
    - "\\bato\\b"
    - revenue nsw
    - state revenue office
    - revenuesa
    - office of state revenue
    - workcover
    - worksafe
    - return to work
    - icare nsw
    - department of
    - services australia
    - centrelink
    - fair work
    - fair entitlements guarantee
    - "\\bfeg\\b"
    - australian securities and investments commission
    - "\\basic\\b"
    - council$
    - city of
    - shire of
    # Building regulators. "Building and Plumbing Commission" was a qualified
    # prospect (TBC) on the 13 September list.
    - building and plumbing commission
    - building commission
    - victorian building authority
    - "\\bvba\\b"
    - "\\bqbcc\\b"
    - fair trading
    - consumer affairs
    - "\\bcommission$"

employees:
  reason: Employee / personal claim - not a company prospect
  patterns:
    - "\\bemployee[s]?\\b"
    - employee entitlements
    - former employee
    - superannuation guarantee
    - "\\bpayg\\b"
    # Entitlement categories, which the priority-creditor tables list as rows
    # in their own right: "Annual Leave" came through as a company owed
    # $27,798 on HOMEMAKERS S.C's listing.
    - "^annual leave"
    - "^long service leave"
    - "^personal leave"
    - "^sick leave"
    - leave loading
    - "^wages"
    - "^salary"
    - "^redundancy"
    - payment in lieu
    - "^superannuation"
    - unpaid entitlements

financiers:
  reason: Secured lender or financier - exposure is not trade credit
  patterns:
    - "\\bbank\\b"
    - banking corporation
    - westpac
    - commonwealth bank
    - "\\bnab\\b"
    - national australia bank
    - "\\banz\\b"
    - bendigo
    - macquarie
    - judo bank
    - prospa
    - moula
    - "\\bfinance\\b"
    - "\\bleasing\\b"
    - "\\blease\\b"
    - "\\brentals?\\b"
    - "\\bhire\\b"
    - asset finance
    - equipment finance
    - "\\bfactoring\\b"
    - invoice finance
    - "\\bbizcap\\b"
    # Card issuers. A card balance is revolving consumer-style credit, not a
    # receivables ledger. AMEX came in at $205,414 on its own.
    - american express
    - "\\bamex\\b"
    - diners club
    - "\\bcredit card\\b"
    - "\\bcapital\\b"
    - credit union
    - building society
    # Non-bank and fintech lenders that turned up as qualified prospects on
    # the 13 September list: Shift ($137,716), Lumi ($50,000), OnDeck
    # ($49,579), Dynamoney ($40,580), MoneyMe ($31,701), Square ($25,477),
    # Procuret (twice), FlexiCommercial and Nissan Financial Services (TBC).
    # Each lends into the company or funds its purchases; none sold it goods
    # on trade terms.
    - "^shift$"
    - shift financial
    - "^lumi$"
    - lumi finance
    - "\\bondeck\\b"
    - on deck capital
    - dynamoney
    - moneyme
    - "\\bsquare australia\\b"
    - "\\bsquare au\\b"
    - procuret
    - flexicommercial
    - flexigroup
    - "\\bhumm\\b"
    - "\\bzip co\\b"
    - "\\bfinancial\\b"
    - "\\blending\\b"
    - "\\bcredit pty\\b"
    - "\\bfunding\\b"
    # Fuel cards. Motorpass ($10,301) is a card issuer billing on account,
    # the same shape as a toll or card balance.
    - motorpass
    - fuel card
    - fleetcard
    - "\\bwex\\b"
    - "\\bshell card\\b"

landlords_utilities:
  reason: Landlord or utility - not a trade receivable
  patterns:
    - "\\blandlord\\b"
    - property trust
    - real estate
    - "\\brealty\\b"
    - body corporate
    - owners corporation
    - "\\benergy\\b"
    - "\\belectricity\\b"
    - origin energy
    - agl
    - "\\bwater corporation\\b"
    - sa water
    - sydney water
    - telstra
    - optus
    - vodafone
    # Toll accounts. Same shape as a utility bill - a recurring service
    # billed on account - and the operators are ASX-scale businesses running
    # their own credit control, not trade credit prospects. Linkt was the
    # highest-scoring prospect in the 12 September run on four appearances.
    - "\\blinkt\\b"
    - transurban
    - "\\bcitylink\\b"
    - "\\beastlink\\b"
    - "\\be-?toll\\b"
    # EnergyAustralia writes its name as one word, so "energy" alone missed
    # it ($10,099 on the 13 September list).
    - energyaustralia
    - "\\bgas\\b"
    - alinta
    - "\\bsimply energy\\b"
    - "\\bred energy\\b"
    # Strata and owners' corporations: "The Owners - Units Plan No 4312" is a
    # body corporate, a landlord-shaped creditor.
    - "^the owners"
    - "\\bunits? plan\\b"
    - "\\bstrata plan\\b"
    - "\\bstrata\\b"

professional_services:
  reason: Insolvency / legal / accounting adviser - not a trade supplier
  patterns:
    - "\\blawyers\\b"
    - "\\blegal\\b"
    - solicitors
    - barristers
    - "\\bliquidator[s]?\\b"
    - insolvency
    - administrators pty
    - worrells
    - "\\bcor cordis\\b"
    - jirsch
    - pitcher partners
    - "\\bbdo\\b"
    - "\\bkpmg\\b"
    - deloitte
    - "\\bpwc\\b"
    - ernst & young
    - grant thornton
    - "\\brsm\\b"
    - chartered accountants
    # Accounting and advisory firms on the 13 September list: KHI Partners
    # ($43,985), DLK Advisory ($19,657), Platinum Advisory Accountants
    # ($15,500), Bell Partners Newcastle ($7,590), and a row simply named
    # "Mergers and Acquisitions" ($16,500). Fees for advice are not trade
    # credit, and an accountant does not insure a receivables ledger on it.
    - "\\baccountants?\\b"
    - "\\baccounting\\b"
    - "\\badvisory\\b"
    - "\\badvisers?\\b"
    - "\\badvisors?\\b"
    - bookkeep
    - "\\btax agents?\\b"
    - mergers and acquisitions
    - khi partners
    - bell partners
    - "\\bconsulting accountants\\b"

insurance:
  reason: Insurer or broker - competitor / not a prospect
  patterns:
    - insurance
    - "\\binsurer\\b"
    - "\\bunderwriting\\b"
    - "\\bbrokers\\b"
    - national credit insurance
    - "\\bnci\\b"
    - "\\batradius\\b"
    - "\\bcoface\\b"
    - "\\ballianz\\b"
    - "\\bqbe\\b"
    - euler hermes
    # Workers' compensation agents and insurance brokers. Gallagher Bassett
    # appeared twice ($82,081 and $22,323); Trade Risk is a broker ($7,096).
    - gallagher bassett
    - workers compensation
    - workers comp
    - "\\bicare\\b"
    - trade risk
    - "\\bbroker\\b"
    - "\\bbroking\\b"

related_party:
  reason: Related party of the insolvent company - not an arm's length supplier
  patterns:
    - "\\bdirector\\b"
    - "\\bshareholder\\b"
    - family trust
    - superannuation fund
    - "\\bsmsf\\b"
    # Trustee vehicles. "DOH Investment Pty Ltd ATF the DOH Investment Trust"
    # was the fourth-highest prospect at $1,000,000 - a holding structure
    # lending into the company, not a supplier with a receivables ledger.
    - "\\batf\\b"
    - as trustee for
    - investment trust
    - "\\bunit trust\\b"

# Creditor names that are junk artefacts of PDF parsing rather than companies.
noise:
  reason: Not a resolvable company name
  patterns:
    - "^total"
    - "^sub-?total"
    - "^unsecured creditors?$"
    - "^secured creditors?$"
    - "^priority creditors?$"
    - "^trade creditors?$"
    - "^various$"
    - "^sundry"
    - "^n/?a$"
    - "^unknown$"
    # A bare trade or category word is a listing artefact, not a company.
    - "^pharmacy$"
    - "^supplier$"
    - "^contractor$"
    - "^creditor$"
    # A company identified only by its ACN has no trading name to call and no
    # receivables ledger to insure - it is a shelf or holding entity. Kept on
    # the excluded tab so the judgement is visible rather than silent.
    - "^a\\.?c\\.?n\\.?[\\s.]*\\d"
