# Telling a person apart from a business, by name alone.
#
# An individual creditor in an insolvency is almost always an employee, a
# director loan or a private lender - not a supplier with a receivables ledger
# to insure. The documents give no direct signal: only one creditor row in 452
# carried the "Withheld due to privacy legislation" address that would mark a
# natural person. So the test is the name itself.
#
# The rule is deliberately one-sided. A name counts as a person only when it
# carries NO business signal at all and reads as two to four given/family
# names. Anything with a legal suffix, a trade word, an acronym, a digit or an
# ampersand is a business. Every drop still lands on the Excluded tab with its
# reason, so a wrong call is visible and this list can be tuned.
#
# Known limitation: a partnership trading under two surnames - "Gross Waddell",
# a real commercial property agency - is indistinguishable from a person by
# name alone, and will be dropped. Add such names to `keep` below.

titles: [mr, mrs, ms, miss, mx, dr, prof, sir, madam]

# Names that look like people but are businesses. Checked before anything else.
keep:
  - Gross Waddell

